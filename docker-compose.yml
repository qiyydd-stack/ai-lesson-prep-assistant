services:
  ai-lesson-prep:
    build: .
    container_name: ai-lesson-prep-assistant
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      SQLITE_DB_PATH: /app/data/app.db
      PYTHON_BIN: python3
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change_this_for_deployment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - lesson_data:/app/data

volumes:
  lesson_data:
